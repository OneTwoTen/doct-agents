name: Validate agents and skills

on:
  pull_request:
    paths:
      - "agents/**"
      - "skills/**"
      - "bin/**"
      - "package.json"
      - "install.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-agents.yml"
      - ".github/workflows/publish-npm.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "skills/**"
      - "bin/**"
      - "package.json"
      - "install.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-agents.yml"
      - ".github/workflows/publish-npm.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-minimum
            os: ubuntu-latest
            node: "18"
            python: "3.9"
          - name: ubuntu-current
            os: ubuntu-latest
            node: "24"
            python: "3.13"
          - name: windows-current
            os: windows-latest
            node: "24"
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show runtime versions
        run: |
          node --version
          npm --version
          python --version
      - name: Run complete repository check
        run: npm run check
