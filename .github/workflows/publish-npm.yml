name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show publishing tool versions
        run: |
          node --version
          npm --version
          python --version

      - name: Run complete repository check
        run: npm run check

      - name: Verify release tag and package version
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish
        run: npm publish --access public
        env:
          # Used for the first publish. After npm Trusted Publishing is configured,
          # the OIDC identity from id-token: write is preferred automatically.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
